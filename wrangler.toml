# Davis Trip Holidays — Cloudflare Pages configuration
# Deploys the static export in ./out (generated by `next build` with output: "export")
#
# CLI deploy:   npx wrangler pages deploy out --project-name davis-trip-holidays
# Dashboard:    connect the Git repo, build command `npx next build`,
#               build output directory `out`

name = "davis-trip-holidays"
pages_build_output_dir = "out"
compatibility_date = "2026-08-01"
