<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- Davis Trip Holidays logomark: twin Himalayan peaks, rising sun, road -->
  <rect width="48" height="48" rx="11" fill="#1f3d33"/>
  <!-- sun -->
  <circle cx="33.5" cy="14.5" r="5" fill="#e8a04c"/>
  <!-- back peak -->
  <path d="M9 35 L20.5 16 L32 35 Z" fill="#ffffff" opacity="0.18"/>
  <!-- front peak -->
  <path d="M17 35 L28.5 16.5 L40 35 Z" fill="#faf8f4"/>
  <!-- snow cap -->
  <path d="M24.9 22.3 L28.5 16.5 L32.1 22.3 L30.6 21.4 L28.5 19.6 L26.4 21.4 Z" fill="#e8a04c"/>
  <!-- road baseline -->
  <rect x="9" y="35" width="31" height="2.6" rx="1.3" fill="#c05f33"/>
</svg>
